<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <title>学中文阅读助理 Learning Chinese Reading Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="reset.css" />
  <link rel="stylesheet" href="lcra.css" />
  <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pinyin4js@1.3.18/dist/pinyin4js.js"></script>
  <script src="x-frame-bypass.js"></script>
  <script src="proxy.js"></script>
  <script src="lcra.js"></script>
</head>
<body>
<main>
<div id="article">
  <div class="article" id="article-placeholder" content=""
content-zh-Hans="基础说明：

1、把文章内容直接复制到这里，或用右上的文章导入功能（⇧）上传本地纯文本文件。如果你覆盖此帮助文本然后还要读，点击在右上高级栏（☰）内的帮助键（?）。
2、在文章中选择任意单词，然后点击词汇下面的添加键（⊕）把所选单词加入到词汇表中。
3、在参考栏选择不同的参考网站，就可以看到不同的翻译和例句。
4、根据参考文献的组合，适当编辑单词的拼音和英文释义。
5、满意后，使用导出功能（⇩）将词汇列表保存至本地。
6、我们提供的CSV导出格式（⇩,）可方便地导入至Anki记忆软件中。
7、不用担心退出这个页面：下次回来依然可以找到你之前输入的数据。

请参阅 https://github.com/infinity0/lcra/blob/gh-pages/README.zh-Hans.rst 为更多详细、提示、和讲高级功能的信息。

"
content-en="Basic instructions:

1. Copy some article text directly into here, or use the import function (⇧) on the top-right to load a local plain text file. If you overwrite this help text and need to read it again, click on the (?) button within the advanced menu (☰) on the top-right.
2. Select a word in the article, then use the add function (⊕) at the bottom of the vocab panel to add it to the vocab list.
3. Use the reference menu to select different reference websites, to see different translations and example sentences.
4. Based on a combination of references, appropriately edit the word's Pinyin and English translation.
5. When satisfied, use the export function (⇩) to save the vocab list to a local file.
6. Our CSV export format (⇩,) can be conveniently imported into the Anki memorisation app.
7. Don't worry about leaving this web page: when you come back the data you input will still be here.

See https://github.com/infinity0/lcra/blob/gh-pages/README.en.rst for more details, tips, and information on advanced features.
"></div>
  <div class="article" id="article-text" contenteditable="true"></div>
  <div id="article-ctl">
    <button id="article-edit" title="">✎</button>
    <button id="article-import" title="" title-en="Import article text">⇧</button>
  </div>
</div>
<script>lcra_articleHide(true); // helps to prevent UI flickers</script>
<div id="control">
  <fieldset id="settings">
    <legend>主要 Main</legend>
    <div class="buttons">
      <button id="article-hide" title=""
        title-en="Hide or show article text box.
  Hiding helps you read in an article in another window:
  Place that and this window side-by-side, then drag words
  from there and drop them into the add button (⊕) here.">⇤</button>
      <button id="help" title="" title-en="Show help text">?</button>
      <spacer></spacer>
      <button id="adv-ctl" title="" title-en="Advanced options">☰</button>
      <div id="advanced">
        <button id="setlang" title="" title-en="Set language of UI hints"><span style="font-size: 65%;"><sup>文</sup><sub>A</sub></span></button>
        <button id="setbw" title="" title-en="Tweak bandwidth usage">📶︎</button>
        <button id="refui" title="" title-en="Switch between auto/desktop/mobile UIs for the reference website, if available">***</button>
        <button id="wipe" title="" title-en="Wipe all local data" title-zh-Hans="擦除所有的本地数据">🗑︎</button>
      </div>
    </div>
    <input type="file" id="article-file" accept="text/*" />
  </fieldset>
  <fieldset id="histctl">
    <legend>词汇 Vocabulary</legend>
    <select id="vocab" size="8" title=""
      title-en="Drag and drop words here to add. Or, click add below.">
      <option value="例子" class="exword"></option>
    </select>
    <div class="buttons">
      <button id="addword" title="" title-en="Add words selected in article, or derived from word selected above. Or, drag and drop words into above.">⊕</button>
      <button id="findword" title="" title-en="Find word selected above in article. Hold shift to toggle highlight.">🔍︎︎</button>
      <button id="delword" title="" title-en="Delete word selected above">⊖</button>
      <button id="delallword" title="" title-en="Delete all words" title-zh-Hans="删除所有的单词">🗑︎</button>
      <spacer></spacer>
      <button id="vocab-export-json" title="" title-en="Export vocab as JSON">⇩{}</button>
      <button id="vocab-export-csv" title="" title-en="Export vocab as CSV">⇩,</button>
    </div>
  </fieldset>
  <fieldset id="wordctl">
    <legend>单词 Word</legend>
    <div><input type="text" class="word-details" id="word-zh-Hans" required value="例子"
      placeholder="" placeholder-en="Edit Chinese word" placeholder-zh-Hans="编辑中文单词" /></div>
    <div><input type="text" class="word-details" id="word-zh-Latn-pinyin" pattern="[^?]*" value="lìzi"
      placeholder="" placeholder-en="Edit Pinyin" placeholder-zh-Hans="编辑拼音"
      title="" title-en="Double-click to reset to the provisional pinyin"/></div>
    <div><textarea class="word-details" id="word-en" rows="2" cols="1"
      placeholder="" placeholder-en="Edit English translation" placeholder-zh-Hans="编辑英文翻译">example</textarea></div>
    <div><input type="text" class="word-details" id="word-src-title"
      placeholder="" placeholder-en="Example source title" placeholder-zh-Hans="例子来源题目" /></div>
    <div><input type="text" class="word-details" id="word-src-url"
      placeholder="" placeholder-en="Example source URL" placeholder-zh-Hans="例子来源网址" /></div>
  </fieldset>
  <fieldset>
    <legend>参考 Reference</legend>
    <select id="refselect">
      <option value="mdbg-ai" selected>MDBG (AI)</option>
      <option value="yellowbridge">YellowBridge</option>
      <option value="wiktionary">Wiktionary</option>
      <option value="baidu-hanyu" content="" content-en="Baidu Hanyu" content-zh-Hans="百度汉语"></option>
      <option value="baidu-fanyi" content="" content-en="Baidu Fanyi" content-zh-Hans="百度翻译"></option>
      <option value="baidu-baike" content="" content-en="Baidu Baike" content-zh-Hans="百度百科"></option>
      <option value="baidu-search" content="" content-en="Baidu Search" content-zh-Hans="百度搜索"></option>
      <option value="purpleculture">Purple Culture</option>
      <option value="hanzicraft">HanziCraft</option>
      <option value="google">Google Translate</option>
      <option value="bing">Bing Translator</option>
    </select>
  </fieldset>
</div>
<div id="references">
  <iframe class="reference" id="mdbg-ai"
    comment="the rest of MDBG's UI is horrific and wastes people's time forcing them to click on multiple things. so we just extract the AI part that actually offers something valuable that other sources don't"
    urlpat="https://www.mdbg.net/chinese/dictionary-ajax?c=aiqhs0&i=XX"
    refurlpat="https://www.mdbg.net/chinese/dictionary?page=worddict&wdqb=XX"
    bandwidth-use="low"
    style="background: white;"
    ></iframe>
  <iframe class="reference" id="yellowbridge"
    comment="the thesaurus page offers something valuable that other sources don't"
    urlpat="https://www.yellowbridge.com/chinese/thesaurus.php?word=XX#mainData"
    bandwidth-use="low"
    sandbox is="x-frame-bypass"
    use-proxy-if="true"
    cors-headers='{"cookie":"PHPSESSID=00000000000000000000000000000000"}'
    src-transform='src => src.replace(
      /(<body\s*[^]*?>)[^]*?(<main\s*[^]*?>[^]*?<\/main>)[^]*?(<\/body>)/g,
      (_, a, b, c) => [a, b, c].join("")
    ).replace(
      /(src|href)="\/\/(r.yellowbridge.com\/.*?)"/g,
      (_, a, h) => `${a}="${LCRA_PROXY}https://${h}"`
    )'
    src-transform-comment="extract the content without ads, redirect includes via our proxy too"
    ></iframe>
  <iframe class="reference" id="wiktionary"
    urlpat=""
    urlpat-desktop="https://en.wiktionary.org/w/index.php?title=TT&mobileaction=toggle_view_desktop#Chinese"
    urlpat-mobile="https://en.m.wiktionary.org/w/index.php?title=TT&mobileaction=toggle_view_mobile#Chinese"
    urlpat-comment="wiktionary puts most details on the article for the traditional character/phrase"
    sandbox is="x-frame-bypass"
    use-proxy-if=""
    use-proxy-if-desktop="lcra_detectMobile()"
    use-proxy-if-mobile="false"
    use-proxy-comment="wiktionary needs to set cookies to allow mobile browsers to visit the desktop UI.
    These days, many browsers prevent doing this for 3rd-party sites in an iframe, so we do it via the proxy."
    cors-headers=""
    cors-headers-desktop='{"cookie":"stopMobileRedirect=true"}'
    bandwidth-use="low"
  ></iframe>
  <iframe class="reference" id="baidu-hanyu"
    urlpat=""
    urlpat-desktop="https://hanyu.baidu.com/s?wd=XX#term-body"
    urlpat-mobile="https://hanyu.baidu.com/hanyu-page/term/detail?wd=XX#detail_shiyi"
    bandwidth-use="mid"
  ></iframe>
  <iframe class="reference" id="baidu-fanyi"
    urlpat="./client/baidu.html#XX"
    refurlpat="https://fanyi.baidu.com/#zh/en/XX"
    bandwidth-use="low"
  ></iframe>
  <iframe class="reference" id="baidu-baike"
    urlpat=""
    urlpat-desktop='https://baike.baidu.com/item/XX#[class^="index-module_navBarWrapper"]'
    urlpat-mobile="https://baike.baidu.com/item/XX#.card-part"
    sandbox is="x-frame-bypass"
    use-proxy-if=""
    use-proxy-if-desktop="true"
    use-proxy-if-mobile="!lcra_detectMobile()"
    use-proxy-comment="without proxy, baidu desktop scripts breaks 多义词 and deletes it from the page after load. mobile is fine. tested 2024-03."
    cors-headers=""
    cors-headers-desktop='{"user-agent": "Mozilla/5.0"}'
    cors-headers-mobile='{"user-agent": "Android/11.0"}'
    bandwidth-use="high"
  ></iframe>
  <iframe class="reference" id="baidu-search"
    urlpat='https://baidu.com/s?wd="XX"的意思#content_style'
    sandbox is="x-frame-bypass"
    use-proxy-if=""
    use-proxy-if-desktop="true"
    use-proxy-if-mobile="!lcra_detectMobile()"
    use-proxy-comment="
    - if we want desktop UI on desktop, we still need to proxy because baidu blocks desktop UAs from accessing their website inside an iframe.
    - if we want desktop UI on mobile, we must proxy to set the user agent.
    - if we want mobile UI on desktop, we must proxy to set the user agent.
    "
    cors-headers=""
    cors-headers-desktop='{"user-agent": "Mozilla/5.0"}'
    cors-headers-mobile='{"user-agent": "Android/11.0"}'
    bandwidth-use="high"
  ></iframe>
  <iframe class="reference" id="purpleculture"
    comment="as of 2025, purpleculture has obnoxious Cloudflare settings that blocks most VPN access even when using it manually via browser. it's not worth it for us to try to work around this; they are shooting themselves in the foot anyway with this overly restrictive tactic."
    urlpat="https://www.purpleculture.net/dictionary-details/?word=XX#resultarea"
    sandbox is="x-frame-bypass"
    use-proxy-if=""
    use-proxy-if-desktop="true"
    use-proxy-if-mobile="!lcra_detectMobile()"
    use-proxy-comment="
    - if we want desktop UI on desktop, we still need to proxy because purpleculture blocks desktop UAs from accessing their website inside an iframe.
    - if we want desktop UI on mobile, we must proxy to set the relevant cookies.
    - if we want mobile UI on desktop, we must proxy to set the relevant cookies.
    "
    cors-headers=""
    cors-headers-desktop='{"cookie": "siteversion=full"}'
    cors-headers-mobile='{"cookie": "siteversion=mobile"}'
    src-transform='src => src.replace(
      /<script src="min\/\?f=(.*)&(amp;)?\d+"><\/script>/g,
      (_, x) => x.split(",").map((p) => `<script src="${p}"></script>`).join("")
    ).replace(
      /<link rel="stylesheet" type="text\/css" href="min\/\?f=(.*)&(amp;)?\d+" *\/>/g,
      (_, x) => x.split(",").map((p) => `<link rel="stylesheet" type="text/css" href="${p}" />`).join("")
    ).replace(/="includes\/templates/g, "=\"/includes/templates")'
    src-transform-comment="work around various purpleculture desktop UI proxy bugs dated 2023-10-16"
    bandwidth-use="mid"
  ></iframe>
  <iframe class="reference" id="hanzicraft"
    urlpat="https://hanzicraft.com/character/XX#display"
    bandwidth-use="low"
  ></iframe>
  <iframe class="reference" id="google"
    urlpat="./client/google2.html?XX"
    refurlpat="https://translate.google.com/?op=translate&sl=zh-CN&tl=en&text=XX"
    bandwidth-use="low"
  ></iframe>
  <iframe class="reference" id="bing"
    urlpat="./client/bing.html#XX"
    refurlpat="https://www.bing.com/translator?from=zh-Hans&to=en&text=XX"
    bandwidth-use="low"
  ></iframe>
  <span id="refurl" class="frameurl"><a href="" target="_blank"
    title=""
    title-en="If some website functionality is broken, use this link to open the reference in a new window."
    title-zh-Hans="如果某些网站功能坏了，使用此链接把参考资料在新窗口中打开。"
  ><span></span></a></span>
  <span id="refcancel"><a href="javascript:void(0);"
    title="If menus are auto-closing, click this to fix. See #6 on github for details."
  >Menus glitching?</a></span>
</div>
</main>
</body>
</html>
